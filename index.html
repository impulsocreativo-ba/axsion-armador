<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axsion · Armador de tablero</title>
<meta name="description" content="Armá el tablero que te gustaría ver en el sistema de Axsion y mandáselo a Impulso Creativo.">
<!-- Si el armador se publica en otra dirección, poné acá su URL (por ejemplo, la de GitHub Pages): los links que se mandan la usan.
     Vacío: se usa la dirección desde donde se abrió la página. -->
<meta name="armador-url" content="https://matiserpa.github.io/axsion-armador/">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- las fuentes no frenan la primera pantalla: se piden como «print» y el script las activa apenas llegan -->
<link rel="stylesheet" id="fuentes" href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800&family=Montserrat:wght@400;500;600;700&display=swap" media="print">
<style>
/* =====================================================================
   Armador de tablero · Axsion. Hecho por Impulso Creativo.
   Marca de Axsion (grafito, rojo de acento, Heebo + Montserrat) con los
   mismos tokens del sistema de órdenes y presupuestos.
   ===================================================================== */
:root{
  --bg:#EFEFEF; --surface:#FFFFFF; --surface-2:#F6F6F6; --ink:#101415; --ink-2:#454B4E; --ink-3:#62686B; --line:#DCDCDC; --line-input:#7A8084;
  --accent-soft:#E9EAEA;
  --brand:#C40826; --brand-2:#960E1C; --brand-text:#C40826; --brand-tint:#FBEAEC; --brand-tint-ink:#960E1C;
  --brand-grad:linear-gradient(135deg,#D7062A 0%,#960E1C 100%);
  --ok:#1D6E43; --ok-soft:#E6F4EC; --warn:#765A00; --warn-soft:#FFF4D6; --bad:#B93A0B; --bad-soft:#FDEEE7;
  --info:#2B5A85; --info-soft:#E8F0F8;
  --col:#E6E6E6; --card:#FFFFFF;
  --chrome:#101415; --chrome-2:#1E2427; --chrome-line:#2C3336; --chrome-ink:#FFFFFF; --chrome-ink-2:#B4BBBE;
  --shadow:0 1px 2px rgba(16,20,21,.06),0 6px 18px rgba(16,20,21,.07);
  --shadow-2:0 2px 6px rgba(16,20,21,.14),0 18px 40px rgba(16,20,21,.2);
  --scrim:rgba(16,20,21,.48);
  --r:4px; --r-s:3px;
  --f-display:'Heebo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --st-acotizar-bg:#FFC7CE; --st-acotizar-ink:#9C0006; --st-encurso-bg:#C6EFCE; --st-encurso-ink:#006100; --st-entregado-bg:#FFEB9C; --st-entregado-ink:#855700;
  --rol-cotiza-bg:#8A4B00; --rol-cotiza-ink:#FFFFFF; --rol-socio-bg:#3B3F99; --rol-socio-ink:#FFFFFF;
  --guia:rgba(16,20,21,.045); --lienzo-borde:#C9CBCC;
  --fila:140px; --gap:12px; --alto-top:100px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101415; --surface:#171C1E; --surface-2:#1F2527; --ink:#EBEBEB; --ink-2:#B4BBBE; --ink-3:#8E9699; --line:#353D41; --line-input:#6B7377;
  --accent-soft:#2A3033;
  --brand:#D7062A; --brand-2:#C40826; --brand-text:#FF5A6E; --brand-tint:#3A1419; --brand-tint-ink:#FF8C99;
  --ok:#4FC688; --ok-soft:#14301F; --warn:#F0B93E; --warn-soft:#33290F; --bad:#FF7A4A; --bad-soft:#3A1F14;
  --info:#7FB0E0; --info-soft:#16263A;
  --col:#1B2123; --card:#232A2D;
  --chrome:#171C1E; --chrome-2:#1F2527; --chrome-line:#2C3336;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35); --shadow-2:0 4px 12px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
  --st-acotizar-bg:#3E1A20; --st-acotizar-ink:#FFC2CA; --st-encurso-bg:#14331F; --st-encurso-ink:#A8E6BD; --st-entregado-bg:#352B0E; --st-entregado-ink:#F2D27A;
  --rol-cotiza-bg:#F2C37E; --rol-cotiza-ink:#332000; --rol-socio-bg:#AEB3F7; --rol-socio-ink:#151842;
  --guia:rgba(255,255,255,.035); --lienzo-borde:#3A4246;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101415; --surface:#171C1E; --surface-2:#1F2527; --ink:#EBEBEB; --ink-2:#B4BBBE; --ink-3:#8E9699; --line:#353D41; --line-input:#6B7377;
  --accent-soft:#2A3033;
  --brand:#D7062A; --brand-2:#C40826; --brand-text:#FF5A6E; --brand-tint:#3A1419; --brand-tint-ink:#FF8C99;
  --ok:#4FC688; --ok-soft:#14301F; --warn:#F0B93E; --warn-soft:#33290F; --bad:#FF7A4A; --bad-soft:#3A1F14;
  --info:#7FB0E0; --info-soft:#16263A;
  --col:#1B2123; --card:#232A2D;
  --chrome:#171C1E; --chrome-2:#1F2527; --chrome-line:#2C3336;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35); --shadow-2:0 4px 12px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
  --st-acotizar-bg:#3E1A20; --st-acotizar-ink:#FFC2CA; --st-encurso-bg:#14331F; --st-encurso-ink:#A8E6BD; --st-entregado-bg:#352B0E; --st-entregado-ink:#F2D27A;
  --rol-cotiza-bg:#F2C37E; --rol-cotiza-ink:#332000; --rol-socio-bg:#AEB3F7; --rol-socio-ink:#151842;
  --guia:rgba(255,255,255,.035); --lienzo-borde:#3A4246;
  color-scheme:dark}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;margin:0;letter-spacing:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ax-simbolos{position:absolute;width:0;height:0;overflow:hidden}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-input);background:var(--surface);color:var(--ink);
  border-radius:var(--r-s);padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px;text-decoration:none;font-size:.88rem;line-height:1.2}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.25)}
.btn.brand{background:var(--brand-grad);border:0;color:#fff;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;padding-inline:16px}
.btn.brand:hover{filter:brightness(1.08);background:var(--brand-grad)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.chrome{background:transparent;border-color:#5A6265;color:var(--chrome-ink)}
.btn.chrome:hover{border-color:#9AA1A4;background:var(--chrome-2)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.82rem}
.btn.grande{min-height:52px;font-size:.95rem;justify-content:flex-start;padding-inline:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-s);padding:1px 7px;font-size:.7rem;font-weight:600;letter-spacing:.02em;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.st-acotizar{background:var(--st-acotizar-bg);color:var(--st-acotizar-ink)} .chip.st-encurso{background:var(--st-encurso-bg);color:var(--st-encurso-ink)} .chip.st-entregado{background:var(--st-entregado-bg);color:var(--st-entregado-ink)}
.chip.tt{background:transparent;color:var(--ink-2);border:1px solid var(--line-input);letter-spacing:.04em}
.chip.dig{background:var(--info-soft);color:var(--info)}
.ini{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:.58rem;font-weight:700;flex:none;background:var(--rol-cotiza-bg);color:var(--rol-cotiza-ink)}
.ini.av-socio{background:var(--rol-socio-bg);color:var(--rol-socio-ink)}

/* ---------- barra superior grafito ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid var(--chrome-line);
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-row{display:flex;align-items:center;gap:10px;padding:10px 0 6px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .ax-logo{display:block;flex:none;width:133px;height:22px;color:var(--chrome-ink)}
.brand-sep{flex:none;width:1px;height:22px;background:var(--chrome-line)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:.02em;text-transform:uppercase;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .chip{background:transparent;color:var(--chrome-ink-2);border:1px solid var(--chrome-line);text-transform:uppercase;letter-spacing:.14em;font-size:.62rem}
.top-acts{display:flex;align-items:center;gap:8px;flex:none}
.tabs-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:2px;margin-left:-12px}
.tab{position:relative;background:none;border:0;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--chrome-ink-2);padding:11px 12px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--chrome-ink)}
.tab[aria-selected="true"]{color:var(--chrome-ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--brand-grad)}
.tab .cnt{font-family:var(--f-body);font-size:.66rem;letter-spacing:0;background:var(--chrome-2);border:1px solid #454B4E;border-radius:var(--r-s);padding:0 5px;color:var(--chrome-ink-2)}
.tab .t-c{display:none}
.top :focus-visible{outline-color:#FFFFFF}
.ayuda-btn{background:none;border:0;color:var(--chrome-ink-2);cursor:pointer;font-size:.8rem;font-weight:600;padding:10px 4px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#5A6265;white-space:nowrap}
.ayuda-btn:hover{color:var(--chrome-ink)}

/* ---------- contenido ---------- */
main{position:relative;flex:1 0 auto;width:100%;max-width:1720px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.arranque{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 14px}
.arranque .lb{font-weight:600;font-size:.84rem;color:var(--ink-2)}
.arranque .btn{min-height:36px}
.guardado{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-3)}
.guardado svg{color:var(--ok)}
.guardado.mal{color:var(--warn)}
.ws{display:grid;grid-template-columns:316px minmax(0,1fr);gap:16px;align-items:start}
.ws.sin-pal{grid-template-columns:minmax(0,1fr)}

/* aviso de link recibido */
.aviso-link{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:var(--r);padding:12px 14px;margin:0 0 14px}
.aviso-link .al-t{flex:1 1 280px;min-width:0}
.aviso-link .al-t b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-transform:uppercase;letter-spacing:.02em}
.aviso-link .al-t span{font-size:.84rem;color:var(--ink-2)}
.aviso-link .al-b{display:flex;flex-wrap:wrap;gap:8px}
.aviso-error{background:var(--bad-soft);border-left:3px solid var(--bad);border-radius:var(--r);padding:10px 14px;margin:0 0 14px;font-size:.9rem}
.aviso-error b{font-family:var(--f-display);font-weight:800}

/* ---------- paleta ---------- */
.paleta{position:sticky;top:calc(var(--alto-top) + 12px);max-height:calc(100vh - var(--alto-top) - 24px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 16px}
.pl-h h2{font-size:1rem;text-transform:uppercase;letter-spacing:.04em}
.pl-h p{font-size:.8rem;color:var(--ink-2);margin-top:2px}
.pl-saltos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.pl-saltos button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 10px;font-size:.74rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.pl-saltos button:hover{border-color:var(--line-input);color:var(--ink)}
.pl-g h3{font-family:var(--f-body);font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:16px 0 2px;scroll-margin-top:8px}
.pl-g .pl-ay{font-size:.74rem;color:var(--ink-3);margin:0 0 6px}
.pl-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pl-it{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0;padding:5px 5px 7px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);
  text-align:left;cursor:grab;color:inherit;font:inherit;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pl-it:hover{border-color:var(--line-input);box-shadow:var(--shadow)}
.pl-it:active{cursor:grabbing}
.pl-it.levantada{outline:3px solid var(--brand-text);outline-offset:1px}
/* WebKit no estira los hijos de un <button> flexible: la muestra lleva su ancho explícito (si no, mide 0 y se ve una caja gris) */
.pl-vista{position:relative;display:block;width:100%;align-self:stretch;height:70px;overflow:hidden;border-radius:var(--r-s);background:var(--bg);pointer-events:none}
.pl-esc{position:absolute;left:0;top:0;width:200%;transform:scale(.5);transform-origin:0 0}
.pl-esc .pz{height:140px;cursor:inherit;box-shadow:none}
.pl-pie{display:flex;width:100%;align-items:flex-start;gap:6px;padding:0 2px}
.pl-nom{flex:1 1 auto;min-width:0;font-weight:600;font-size:.76rem;line-height:1.25;overflow-wrap:anywhere}
.pl-mas{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-weight:700;font-size:.9rem;line-height:1}
.pl-ya{display:block;font-size:.66rem;font-weight:600;color:var(--ok);margin-top:1px}
.pl-grip{display:none}
.pl-it.falta .pl-vista{display:flex;align-items:center;justify-content:center;border:1px dashed var(--brand-text);background:var(--brand-tint);color:var(--brand-tint-ink);font-weight:700;font-size:.8rem;text-align:center;padding:6px}
.pl-g.otra .pl-items{grid-template-columns:minmax(0,1fr)}

/* ---------- lienzo (12 columnas en la compu) ---------- */
.lienzo{min-width:0;position:relative}
.lz-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin:0 0 10px}
.lz-h h2{font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em}
.lz-h p{margin-top:2px;color:var(--ink-2);font-size:.84rem;max-width:62em}
.lista{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:var(--fila);gap:var(--gap);padding:var(--gap);
  min-height:calc(var(--fila) * 2 + var(--gap) * 3);border:1px dashed var(--lienzo-borde);border-radius:var(--r);
  background-image:linear-gradient(90deg,var(--guia) calc(100% - var(--gap)),transparent 0);background-size:calc((100% - var(--gap)) / 12) 100%;background-position:var(--gap) 0}
.lista.ver{background-image:none;border-color:transparent;padding:0}
.vacio{position:absolute;left:var(--gap);right:var(--gap);top:52px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 16px;text-align:center;color:var(--ink-2);pointer-events:none}
.vacio h3{font-size:1.25rem;color:var(--ink);text-transform:uppercase;letter-spacing:.02em}
.vacio p{max-width:34em}
.vacio .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto;margin-top:4px}
.lienzo.con-ph .vacio{display:none}

/* ---------- pieza ---------- */
.pz{--w:3;--h:1;grid-column:span var(--w);grid-row:span var(--h);position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:box-shadow .12s,border-color .12s}
.pz:hover{border-color:var(--line-input);box-shadow:var(--shadow)}
.pz,.mapa,.lz-h{scroll-margin-top:calc(var(--alto-top) + 12px)}
@media (max-width:760px){.pz,.mapa,.lz-h{scroll-margin-top:12px}}
.pz.imp{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pz.sel{outline:3px solid var(--brand-text);outline-offset:2px}
.pz[data-g="col"]{background:var(--col);border-top:3px solid var(--ink-3)}
.pz[data-st="st-acotizar"]{border-top-color:var(--st-acotizar-ink)} .pz[data-st="st-encurso"]{border-top-color:var(--st-encurso-ink)} .pz[data-st="st-entregado"]{border-top-color:var(--st-entregado-ink)}
.pz[data-g="otra"]{border:1px dashed var(--brand-text);background:var(--brand-tint)}
.pz-h{display:flex;align-items:center;gap:4px;min-height:36px;padding:4px 4px 2px 4px;flex:none}
.modo-editar .pz-h{cursor:grab}
.pz-grip{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:30px;margin-right:2px;border-radius:var(--r-s);color:var(--ink-3);cursor:grab;touch-action:none}
.pz-grip:hover{background:var(--surface-2);color:var(--ink)}
.pz-t{flex:1 1 auto;min-width:0;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3;overflow-wrap:anywhere;font-weight:600;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.pz[data-g="col"] .pz-t{font-family:var(--f-display);font-weight:800;font-size:.72rem;color:var(--ink)}
.pz[data-g="lst"] .pz-t,.pz[data-g="gra"] .pz-t,.pz[data-g="otra"] .pz-t{font-family:var(--f-display);font-weight:800;font-size:.86rem;letter-spacing:.04em;color:var(--ink)}
.pz[data-g="num"] .pz-t,.pz[data-g="her"] .pz-t{letter-spacing:.1em}
.pz-n{flex:none;font-family:var(--f-display);font-weight:800;font-size:1rem;color:var(--ink-2);padding:0 4px}
.pz-top{flex:none;color:var(--brand-text);font-size:1rem;line-height:1;padding:0 2px}
/* las marcas («Yo», «Mi equipo», «Nota») van en una franja propia abajo: no tapan el contenido de la pieza */
.pz-marcas{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;padding:2px 8px 6px;pointer-events:none}
.pz:has(.pz-marcas) .pz-b{padding-bottom:4px}
.mk{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:var(--r-s);font-size:.66rem;font-weight:700;white-space:nowrap;background:var(--surface);color:var(--ink-2);border:1px solid var(--line-input);box-shadow:0 1px 3px rgba(16,20,21,.12)}
.mk.ve{color:var(--info);background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.mk.ve.yo{color:var(--brand-tint-ink);background:var(--brand-tint);border-color:color-mix(in srgb,var(--brand-text) 35%,transparent)}
.mk svg.ic{width:12px;height:12px}
.pz-bt{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;border-radius:var(--r-s);background:none;color:var(--ink-2);cursor:pointer;padding:0}
.pz-bt:hover{background:var(--surface-2);color:var(--ink)}
.pz-bt.mas{font-size:1.2rem;letter-spacing:.05em;line-height:1}
.pz-bt.sacar{width:auto;padding:0 8px;gap:5px;font-size:.72rem;font-weight:600}
.pz-bt[disabled]{opacity:.3;cursor:default}
.pz-b{flex:1 1 auto;min-height:0;overflow:hidden;padding:0 12px 10px}
.pz[data-g="col"] .pz-b{padding:2px 8px 8px}
.pz:is([data-g="col"],[data-g="lst"]) .pz-b{-webkit-mask-image:linear-gradient(#000 calc(100% - 26px),transparent);mask-image:linear-gradient(#000 calc(100% - 26px),transparent)}
.pz.nueva{animation:nueva 1.4s ease-out}
@keyframes nueva{0%,30%{box-shadow:0 0 0 4px var(--brand-text)}100%{box-shadow:0 0 0 0 transparent}}
/* sin consultas de contenedor: con 29 piezas duplicaban el trabajo de diseño en cada cambio (se nota en un celular) */
@media (max-width:389px){ .sacar-t{display:none} }
@media (prefers-reduced-motion:reduce){.pz.nueva{animation:none;outline:3px solid var(--brand-text)}}
.solo-angosto{display:none!important}

/* números de arriba (como los tiles del sistema) */
.nm{display:flex;flex-direction:column;gap:2px;padding-top:2px}
.nm .v{font-family:var(--f-display);font-weight:800;font-size:1.85rem;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .v small{font-size:.55em;font-weight:700;color:var(--ink-2)}
.nm .s{font-size:.74rem;color:var(--ink-2);line-height:1.35}
/* con la franja de marcas abajo, la aclaración del número va en dos renglones como mucho (con «…»), sin cortarse a la mitad */
.pz:has(.pz-marcas) .nm .s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nm.alarm .v{color:var(--bad)}
.nm.ok .v{color:var(--ok)}

/* columnas y tarjetas (como el tablero del sistema) */
.cards{display:flex;flex-direction:column;gap:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card.is-late{box-shadow:inset 3px 0 0 var(--bad)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card-top .code{font-size:.72rem;font-weight:600;letter-spacing:.02em;color:var(--ink-3)}
.card-flags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.card-flags .chip{white-space:normal;text-align:right}
.card-client{font-weight:700;font-size:.84rem;line-height:1.25;overflow-wrap:anywhere}
.card-sub{font-size:.72rem;color:var(--ink-3);overflow-wrap:anywhere}
.card-tt{display:flex;gap:4px;flex-wrap:wrap}
.card-amt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:3px;padding-top:5px;border-top:1px solid var(--line)}
.card-amt .lb{font-size:.68rem;color:var(--ink-3)}
.card-amt b{font-family:var(--f-display);font-weight:800;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.card-pr{font-size:.68rem;color:var(--ink-3)}
.card-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.7rem;color:var(--ink-2)}

/* listas */
.filas{display:flex;flex-direction:column;gap:6px}
.fl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:6px 9px;border:1px solid var(--line);border-left:3px solid var(--info);border-radius:var(--r);background:var(--surface);font-size:.76rem;min-width:0}
.fl.bad{border-left-color:var(--bad)} .fl.warn{border-left-color:var(--warn)} .fl.neutro{border-left-color:var(--line-input)} .fl.ok{border-left-color:var(--ok)}
.fl-a{font-weight:700;white-space:nowrap}
.fl-b{flex:1 1 9em;min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
.fl-b small{display:block;font-size:.68rem;color:var(--ink-3)}
.fl-m{font-family:var(--f-display);font-weight:800;font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto}
.fl .chip{font-size:.62rem}

/* gráficos */
.pz[data-g="gra"] .pz-b{display:flex;flex-direction:column;gap:4px}
.gr-cap{font-size:.72rem;color:var(--ink-2)}
.gr-cap b{color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:.92rem}
.gv{flex:1 1 auto;min-height:40px;display:flex;gap:3%;position:relative;padding-bottom:15px}
.gv-c{flex:1 1 0;display:flex;flex-direction:column;position:relative;min-width:0}
.gv-p{display:flex;align-items:flex-end}
.gv-n{flex:1 1 auto;display:flex;align-items:flex-start;border-top:1px solid var(--line-input)}
.gv i{display:block;width:100%;background:var(--ink-2);border-radius:1px 1px 0 0;min-height:1px}
.gv .gv-n i{background:var(--bad);border-radius:0 0 1px 1px}
.gv .ult i{background:var(--ink)}
.gv-c>span{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-size:.6rem;color:var(--ink-3);line-height:15px}
.gh{display:flex;flex-direction:column;gap:5px;flex:1 1 auto;min-height:0}
.gh-f{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;align-items:center;gap:8px;font-size:.72rem}
.gh-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.gh-t{height:9px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.gh-t i{display:block;height:100%;background:var(--ink-2)}
.gh-f b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}

/* herramientas */
.fx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:2px}
.fx-in,.fx-sel{display:flex;align-items:center;gap:8px;min-height:38px;padding:8px 10px;border:1px solid var(--line-input);border-radius:var(--r-s);background:var(--surface);color:var(--ink-3);font-size:.8rem;min-width:0}
.fx-in{flex:1 1 100%}
.fx-in span,.fx-sel span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fx-sel{flex:1 1 10em;justify-content:space-between;color:var(--ink)}
.fx-sel::after{content:"▾";font-size:.7rem;color:var(--ink-3)}
.fx-btn{display:inline-flex;align-items:center;min-height:38px;padding:8px 16px;border-radius:var(--r-s);background:var(--brand-grad);color:#fff;font-weight:600;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.fa-d{font-size:.84rem;color:var(--ink);overflow-wrap:anywhere;white-space:pre-line}
.fa-d.vacia{color:var(--ink-2);font-style:italic}

/* ---------- vista del celular ---------- */
.cel-ws{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.fono{width:392px;border:10px solid #101415;border-radius:38px;background:var(--bg);box-shadow:var(--shadow-2);overflow:hidden;position:relative}
.fono-pant{height:min(760px,calc(100vh - var(--alto-top) - 120px));min-height:420px;overflow-y:auto;overscroll-behavior:contain}
.fono-app{background:#101415;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 10px}
.fono-app .ax-logo{width:96px;height:16px;color:#fff;display:block}
.fono-app span{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#B4BBBE;border:1px solid #2C3336;border-radius:3px;padding:1px 6px}
.lista.una{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;background-image:none}
.una .pz{grid-column:1/-1;grid-row:auto}
.una .pz[data-h="1"] .pz-b{max-height:150px}
.una .pz[data-h="2"] .pz-b{max-height:300px}
.una .pz[data-g="num"] .pz-b,.una .pz[data-g="her"] .pz-b{max-height:none}
.fono .lista.una{border:0;border-radius:0;padding:10px;min-height:300px;gap:10px}
.cel-lado{display:flex;flex-direction:column;gap:12px;min-width:0;max-width:440px}
.caja{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.caja h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.caja p{font-size:.86rem;color:var(--ink-2)}
.caja .btn{margin-top:10px}
.fuera-l{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.fuera-l li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);min-width:0}
.fuera-l li span{min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:.86rem}
.fuera-l .btn{margin:0;flex:none}
.estado-cel{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--ok)}
.estado-cel.propio{color:var(--info)}

/* ---------- lo que ve mi equipo ---------- */
.eq-yo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand-text);font-size:.86rem;min-width:0}
.eq-yo .chip,.eq-yo .chipbtn{max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:left}
.eq-yo .chipbtn{border:1px solid var(--line-input);background:var(--surface);border-radius:var(--r-s);padding:4px 10px;font-size:.8rem;font-weight:600;cursor:pointer;min-height:32px}
.eq-yo .chipbtn:hover{background:var(--surface-2)}

/* mapa de la compu (solo en el celular) */
.mapa{display:none}

/* ---------- capas: diálogos, hojas y el editor de la pieza ---------- */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--scrim);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:var(--r);border-top:3px solid var(--brand);box-shadow:var(--shadow-2);width:min(560px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;
  padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlg.ancho{width:min(760px,100%)}
.dlg>*,.pop>*,.hoja>*{flex-shrink:0}
.hoja>.hoja-c{flex-shrink:1}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dlg h2{text-transform:uppercase;font-size:1.2rem;letter-spacing:.02em;line-height:1.2}
.dlg .intro{color:var(--ink-2);font-size:.92rem}
.x{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin:-6px -8px 0 0;border:0;border-radius:var(--r-s);background:none;color:var(--ink-2);cursor:pointer;font-size:1.1rem}
.x:hover{background:var(--surface-2);color:var(--ink)}
.dlg-pie{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.fld small{font-size:.74rem;color:var(--ink-3)}
input[type=text],textarea{background:var(--surface);border:1px solid var(--line-input);border-radius:var(--r-s);padding:9px 10px;min-width:0;width:100%;font-size:.9rem}
textarea{resize:vertical;min-height:76px;line-height:1.4}
::placeholder{color:var(--ink-3);opacity:1}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:5px;padding:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;border:1px solid var(--line-input);border-radius:var(--r-s);overflow:hidden}
.seg label{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:40px;padding:5px 4px;cursor:pointer;font-weight:600;font-size:.82rem;line-height:1.15;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg label small{font-size:.66rem;font-weight:500;color:var(--ink-3)}
.seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.seg label.on,.seg label:has(input:checked){background:var(--ink);color:var(--surface)}
.seg label.on small,.seg label:has(input:checked) small{color:var(--surface);opacity:.8}
.seg label:has(input:focus-visible){outline:2px solid var(--brand-text);outline-offset:-3px}
.tog{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line-input);border-radius:var(--r-s);background:var(--surface);cursor:pointer;font-weight:600;text-align:left}
.tog .tg-i{flex:none;font-size:1.15rem;line-height:1;color:var(--ink-3)}
.tog[aria-pressed="true"]{background:var(--brand-tint);border-color:var(--brand-text);color:var(--brand-tint-ink)}
.tog[aria-pressed="true"] .tg-i{color:var(--brand-text)}
.tog>span:last-child{display:flex;flex-direction:column;gap:1px}
.tog small{display:block;font-weight:500;font-size:.72rem;color:var(--ink-3)}
.sug{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sug::before{content:"Sumá:";font-size:.74rem;color:var(--ink-3);margin-right:2px}
.sug button{border:1px dashed var(--line-input);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:.76rem;font-weight:600;cursor:pointer;color:var(--ink-2);min-height:30px}
.sug button:hover{border-style:solid;color:var(--ink)}

.pop{position:fixed;z-index:55;width:344px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:var(--r);box-shadow:var(--shadow-2);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ed-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ed-h h2{font-size:1.05rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.2;overflow-wrap:anywhere}
.ed-sub{font-size:.76rem;color:var(--ink-3);margin-top:2px}
.ed-acc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ed-acc .btn{min-height:40px}
.pop .ed-acc{grid-template-columns:repeat(4,minmax(0,1fr))}
.pop .ed-acc .btn{padding-inline:4px;font-size:.8rem;gap:3px}
.ed-pie{display:flex;justify-content:flex-end;position:sticky;bottom:-16px;z-index:2;background:var(--surface);margin:0 -16px -16px;padding:10px 16px 12px;border-top:1px solid var(--line)}
.ed-pie .btn{min-width:120px}
.hoja{background:var(--surface);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:var(--r);border-top:3px solid var(--brand);box-shadow:var(--shadow-2);overflow:hidden}
.hoja-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.hoja-h h2{font-size:1.1rem;text-transform:uppercase;letter-spacing:.02em}
.hoja-h p{font-size:.82rem;color:var(--ink-2);margin-top:2px}
.hoja-c{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 18px}
.hoja-c .pl-items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mas-l{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.mas-l .btn{width:100%}
.mas-l h3{font-family:var(--f-body);font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:8px 0 0}

/* bienvenida */
.pasos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pasos li{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pasos .nro{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--brand-grad);color:#fff;font-family:var(--f-display);font-weight:800;font-size:1rem}
.pasos li>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pasos b{font-family:var(--f-display);font-weight:800;font-size:1.02rem;text-transform:uppercase;letter-spacing:.02em}
.pasos span{font-size:.84rem;color:var(--ink-2)}
.bv-nota{font-size:.82rem;color:var(--ink-2);background:var(--info-soft);border-radius:var(--r);padding:8px 12px}
.link-btn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* enviar */
.env-res{display:flex;flex-wrap:wrap;gap:6px}
.env-res .chip{font-size:.76rem;padding:3px 9px}
.env-bt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.env-bt .btn{min-height:56px;flex-direction:column;gap:3px;white-space:normal;text-align:center;font-size:.86rem}
.env-bt .btn svg.ic{width:20px;height:20px}
.env-bt .btn.wa{background:#1D6E43;border-color:#1D6E43;color:#fff}
.env-bt .btn.wa:hover{filter:brightness(1.12)}
.env-aviso{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:var(--r);padding:10px 12px;font-size:.86rem;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.env-arch{display:flex;flex-wrap:wrap;gap:8px}
.env-priv{font-size:.76rem;color:var(--ink-3)}
.env-largo{font-size:.74rem;color:var(--ink-3)}

/* imagen */
.img-ops{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.img-op{display:flex;flex-direction:column;gap:8px;min-width:0}
.img-op .marco{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);height:260px;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.img-op img{max-width:100%;max-height:100%;display:block}
.img-op b{font-size:.86rem}

/* notas */
.notas-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.notas-l li{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);min-width:0}
.notas-l .nt-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.notas-l .nt-t b{font-weight:700}
.notas-l .nt-m{font-size:.76rem;color:var(--ink-3)}
.notas-l .nt-x{margin-top:4px;font-size:.88rem;white-space:pre-line;overflow-wrap:anywhere}
.notas-l .nt-x.sin{color:var(--ink-3);font-style:italic}

/* aviso flotante */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,560px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface);padding:8px 8px 8px 16px;border-radius:var(--r);font-weight:600;font-size:.88rem;box-shadow:var(--shadow-2);max-width:100%}
.toast span{flex:1 1 auto;min-width:0}
.toast button{flex:none;min-height:40px;padding:6px 14px;border:1px solid currentColor;border-radius:var(--r-s);background:none;color:inherit;font-weight:700;cursor:pointer}
.toast:not(:has(button)){padding:12px 16px}
/* con una hoja, un diálogo o el editor abiertos, el aviso queda debajo: así su «Deshacer» nunca cae encima de un botón de la capa */
body.con-capa #toast{z-index:50}
.env-ok{color:var(--ok);font-weight:600}
/* para el teclado: saltar la paleta e ir directo al tablero */
.saltar{position:absolute;left:16px;top:8px;z-index:40;opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);border:0;border-radius:var(--r-s);padding:10px 14px;min-height:44px;font-weight:700;cursor:pointer}
.saltar:focus{opacity:1;pointer-events:auto}

/* arrastre */
.fantasma{position:fixed;left:0;top:0;z-index:90;pointer-events:none;opacity:.94;box-shadow:var(--shadow-2);transform-origin:0 0;will-change:transform}
.fantasma.pz{height:auto!important;max-height:240px}
.fantasma.chipf{background:var(--ink);color:var(--surface);border-radius:var(--r);padding:10px 14px;font-weight:700;font-size:.86rem;white-space:nowrap}
.pz.arrastrando{opacity:.35;border-style:dashed;box-shadow:none}
.pz.ph{background:transparent;border:2px dashed var(--brand-text);box-shadow:none}
body.arrastre,body.arrastre *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
/* mientras se arrastra, el navegador no corre la página para «seguir» a una pieza: si no, al mover el marcador
   la lista salta debajo del dedo y el lugar elegido va y viene */
body.arrastre{overflow-anchor:none}

/* pie */
.pie{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center;font-size:.74rem;color:var(--ink-3)}
.barra-cel{display:none}

/* ---------- compu angosta: la paleta va en una hoja ---------- */
@media (max-width:1099px){
  .ws{grid-template-columns:minmax(0,1fr)}
  .ws>.paleta{display:none}
  .cel-ws{grid-template-columns:minmax(0,1fr)}
  .fono{justify-self:center}
}
@media (min-width:1100px){ .solo-sin-paleta{display:none!important} .solo-medio{display:none!important} }
@media (max-width:1099px){ .no-medio{display:none!important} .brand .chip{display:none} }
/* pantallas táctiles grandes (tabletas): los toques también miden 44 px */
@media (pointer:coarse) and (min-width:761px){
  .pz-bt,.pz-grip{min-width:44px;min-height:44px} .pz-h{min-height:48px}
  .btn,.btn.sm,.tab,.ayuda-btn,.pl-saltos button,.sug button,.eq-yo .chipbtn,.x{min-height:44px} .x{min-width:44px}
  .seg label{min-height:48px}
}
@media (max-width:1099px){ .solo-con-paleta{display:none!important} }
@media (min-width:761px){
  .modal.hoja-m{align-items:center}
}

/* ---------- celular (320 a 760 px) ---------- */
@media (max-width:760px){
  :root{--gap:10px}
  /* las pestañas quedan fijas arriba al bajar (la fila de la marca se va) */
  .top{position:sticky;top:calc(-1 * var(--alto-marca,0px))}
  html{scroll-padding-top:calc(var(--alto-tabs,0px) + 8px)}
  .pz,.mapa,.lz-h{scroll-margin-top:calc(var(--alto-tabs,0px) + 12px)}
  .cel-lado{order:-1}
  .top-row{min-height:0;padding:8px 0 4px;gap:8px}
  .brand{gap:8px}
  .brand .ax-logo{width:109px;height:18px}
  .brand-sep{height:18px}
  .brand b{font-size:.78rem;white-space:normal;line-height:1.15;overflow:visible}
  .brand .chip{display:none}
  .no-angosto{display:none!important}
  .solo-angosto{display:inline-flex!important}
  .tabs-row{display:block}
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 -4px;gap:0}
  .tab{justify-content:center;min-height:44px;padding:8px 4px 10px;letter-spacing:.08em;font-size:.7rem}
  .tab::after{left:8px!important;right:8px!important}
  .tab .t-l{display:none} .tab .t-c{display:inline}
  .top-acts .btn{min-height:44px;min-width:44px}
  main{padding-top:12px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .arranque{gap:6px 8px}
  .arranque .lb,.arranque .btn{display:none}
  .arranque{margin-bottom:6px}
  .guardado{margin-left:0;flex:1 1 100%}
  .lz-h p{font-size:.82rem}
  .lz-h .btn{display:none}
  .lista{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;background-image:none;padding:8px;gap:10px}
  .lista .pz{grid-column:1/-1;grid-row:auto}
  .lista .pz[data-h="1"] .pz-b{max-height:150px}
  .lista .pz[data-h="2"] .pz-b{max-height:300px}
  .lista .pz:is([data-g="num"],[data-g="her"],[data-g="otra"]) .pz-b{max-height:none}
  .lista.ver{padding:0}
  .pz-h{min-height:48px;padding:2px 2px 2px 0}
  .pz-grip{width:44px;height:44px;margin:0}
  .pz-bt{width:44px;height:44px}
  .pz-bt.sacar{width:auto;min-width:44px;padding:0 10px}
  .pz-t{padding-left:2px}
  .ver .pz-t{padding-left:12px}
  .pz .pz-b{padding-bottom:12px}
  .vacio{top:40px}
  /* mapa de la compu, arriba de la lista */
  .mapa{display:block;margin:0 0 12px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .mapa[open]{padding-bottom:12px}
  .mapa-t{display:flex;flex-direction:column;justify-content:center;min-height:48px;font-weight:700;font-size:.84rem;cursor:pointer;list-style:none;position:relative;padding-right:28px}
  .mapa-t::-webkit-details-marker{display:none}
  .mapa-t::after{content:"▾";position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
  .mapa[open] .mapa-t::after{content:"▴"}
  .mapa-t small{display:block;font-weight:500;color:var(--ink-3);font-size:.72rem}
  .mapa-g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:18px;gap:3px}
  .mapa-p{grid-column:span var(--w);grid-row:span var(--h);min-width:0;border-radius:2px;background:var(--surface-2);border:1px solid var(--line-input);font-size:.56rem;font-weight:600;line-height:16px;padding:0 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink-2)}
  .mapa-p[data-g="col"]{border-top:2px solid var(--ink-3)}
  .mapa-p.imp{border-color:var(--ink);color:var(--ink)}
  /* celular: sin marco de teléfono */
  .cel-ws{display:flex;flex-direction:column;gap:12px}
  .fono{width:auto;border:0;border-radius:0;box-shadow:none;background:none;overflow:visible;align-self:stretch}
  .fono-pant{height:auto;min-height:0;overflow:visible}
  .fono-app{display:none}
  .fono .lista.una{border:1px dashed var(--lienzo-borde);border-radius:var(--r);padding:8px;min-height:120px}
  .cel-lado{max-width:none}
  .fuera-l .btn{min-height:44px}
  .caja .btn{min-height:44px;width:100%}
  .caja .fuera-l .btn{width:auto}   /* en la lista de las que no van, el botón no aplasta el nombre */
  .eq-yo .chipbtn{min-height:44px}
  /* capas: hojas que suben desde abajo */
  .modal{align-items:flex-end;padding:0;padding-top:max(24px,env(safe-area-inset-top,0px))}
  .dlg,.hoja,.dlg.ancho{width:100%;max-height:100%;border-radius:12px 12px 0 0;border-top:3px solid var(--brand);padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
  .dlg{padding:16px 16px max(16px,env(safe-area-inset-bottom,0px))}
  .hoja-c{padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
  .x{width:44px;height:44px;margin:-8px -10px 0 0}
  .btn,.btn.sm{min-height:44px}
  .seg label{min-height:48px}
  .sug button{min-height:44px}
  input[type=text],textarea{font-size:16px}
  .pasos{grid-template-columns:minmax(0,1fr);gap:8px}
  .pasos li{flex-direction:row;align-items:flex-start;gap:12px;padding:10px 12px}
  .pasos li>div{display:flex;flex-direction:column;gap:2px;min-width:0}
  .env-bt{grid-template-columns:minmax(0,1fr)}
  .env-bt .btn{flex-direction:row;justify-content:flex-start;min-height:52px;font-size:.95rem}
  .img-ops{grid-template-columns:minmax(0,1fr)}
  .img-op .marco{height:180px}
  .dlg-pie .btn{flex:1 1 auto}
  .ed-acc .btn{min-height:44px}
  .dlg.ed{padding-top:0;padding-bottom:0;gap:14px}
  .dlg.ed .ed-h{position:sticky;top:0;z-index:2;background:var(--surface);margin:0 -16px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .dlg.ed .ed-pie{bottom:0;margin:0 -16px;padding:10px 16px max(12px,env(safe-area-inset-bottom,0px))}
  .dlg.ed .ed-pie .btn{flex:1 1 auto}
  .toast button{min-height:44px}
  .pl-items{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .pl-saltos button{min-height:44px;padding:4px 12px}
  .pl-it{min-height:44px}
  .aviso-link .al-b{width:100%}
  .aviso-link .al-b .btn{flex:1 1 auto}
  .pie{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  html{scroll-padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .barra-cel{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(16,20,21,.1);
    padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .barra-cel .btn{flex:1 1 0;min-height:48px;padding-inline:8px;white-space:normal;line-height:1.15;text-align:center}
}
@media (max-width:359px){
  .brand b{font-size:.7rem}
  .tab{font-size:.64rem;letter-spacing:.04em}
  .barra-cel .btn.brand{font-size:.72rem;letter-spacing:.03em}
}
</style>
</head>

function agregar(catId, enIndice, extra) {

  cambiar(d => {
    const p = nuevaPieza(d, catId, null, null, extra); id = p.id;
    if (tab === 'cel' && enIndice != null) {

      d.piezas.push(p);
      const ref = vis[enIndice], k = ref ? todo.indexOf(ref) : todo.length; todo.splice(k < 0 ? todo.length : k, 0, p.id);
      d.movil.orden = todo; d.movil.propio = true;
    } else if (enIndice == null || enIndice > d.piezas.length) d.piezas.push(p); else d.piezas.splice(enIndice, 0, p);
  }, { render: false });
  nueva = id; render();
  aviso(`Sumaste «${nombreDe(porId(estado, id))}»${enIndice == null ? ' al final' : ''}.`, { deshacer: true });
  return id;
}

      const vis = visiblesCel(d), i = vis.indexOf(id), j = i + delta; if (i < 0 || j < 0 || j >= vis.length) return;
      [vis[i], vis[j]] = [vis[j], vis[i]]; const f = fueraCel(d); d.movil.orden = vis.concat(ordenCel(d).filter(x => f.has(x))); d.movil.propio = true;
    } else {
      const i = d.piezas.findIndex(p => p.id === id), j = i + delta; if (i < 0 || j < 0 || j >= d.piezas.length) return;
      const [p] = d.piezas.splice(i, 1); d.piezas.splice(j, 0, p);

}

    const c = capas[capas.length - 1]; if (c.tipo === 'editor' && !angosto()) return;
    const f = $$('button:not([disabled]),a[href],input,textarea,[tabindex="0"]', c.el).filter(x => x.offsetParent !== null);

  }
});
